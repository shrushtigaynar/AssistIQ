services:
  - type: web
    name: assistiq-api
    runtime: node
    rootDir: server
    buildCommand: npm ci
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: MONGODB_REQUIRED
        value: "true"
      - key: MONGODB_URI
        sync: false
      - key: CLIENT_URL
        sync: false
      - key: ENCRYPTION_SECRET
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: GOOGLE_REDIRECT_URI
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-2.0-flash
      - key: AI_CONFIDENCE_THRESHOLD
        value: "0.75"
